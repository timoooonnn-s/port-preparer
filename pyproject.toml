[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-preparer"
version = "0.1.0"
description = "Create and audit configured access ports on Extreme VOSS / Fabric Connect switches"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# netmiko is only needed to talk to real switches. Parsers and the audit engine
# run against captured output without it, so the test suite has no network deps.
ssh = ["netmiko>=4.3"]
dev = ["pytest>=8.0"]

[project.scripts]
port-preparer = "port_preparer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
